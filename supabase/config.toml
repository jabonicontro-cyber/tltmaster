# Supabase CLI configuration for local development (`npx supabase start`).
# Hosted projects are configured in the Supabase dashboard — see docs/SETUP.md.
project_id = "top-line-trucking-manager"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
# Accounts are created by an owner (invite) — no public sign-up.
enable_signup = false
minimum_password_length = 10

[auth.email]
# Must stay true: in this section it enables the email/password provider
# itself (sign-in, invitations, password reset). Public sign-up is blocked by
# [auth] enable_signup = false above.
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.email.template.recovery]
subject = "Reset your Top Line Trucking Manager password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You're invited to Top Line Trucking Manager"
content_path = "./supabase/templates/invite.html"
